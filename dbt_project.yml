
name: 'stackoverflow'
version: '1.0.0'
config-version: 2

profile: 'default'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"  # directory which will store compiled SQL files
clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"

models:
  stackoverflow:
    +schema: stackoverflow
    stg_unanswered_questions:
      +materialized: view
    stg_tags:
      +materialized: view
    question_tag_bridge:
      +materialized: view
    trending_tags:
      +materialized: table
